# @package _global_

domain_rand:
  # push robots
  push_robots : True
  push_interval_s : [1, 3]
  push_vel_range: {x: [-0.5, 0.5], y: [-0.5, 0.5], z: [-0.2, 0.2]}
  push_ang_vel_range: {roll: [-0.52, 0.52], pitch: [-0.52, 0.52], yaw: [-0.78, 0.78]}

  # base com
  randomize_base_com : True
  base_com_range:
    x : [-0.025, 0.025]
    y : [-0.05, 0.05]
    z : [-0.05, 0.05]

  randomize_default_dof_pos: True
  default_dof_pos_range: [-0.01,0.01]
  # link mass
  randomize_link_mass : False
  link_mass_range : [0.8, 1.2]

  # pd gain
  randomize_pd_gain : False
  kp_range : [0.75, 1.25]
  kd_range : [0.75, 1.25]

  # friction
  randomize_friction : True
  friction_range : [0.3, 1.6]

  # base mass
  randomize_base_mass : False

  # rfi
  randomize_torque_rfi : False
  rfi_lim : 0.1
  randomize_rfi_lim : False
  rfi_lim_range : [0.5, 1.5]


  # control delay
  randomize_ctrl_delay : False
  ctrl_delay_step_range : [0, 2] # integer max real delay is 90ms