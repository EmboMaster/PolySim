# @package _global_

# Modified observation configuration to match target repository structure
# Based on original config with history support maintained

obs:
  obs_dict:
    actor_obs: [
      # Robot anchor (base) state in world frame
      generated_commands,
      motion_anchor_ori_b,
      base_ang_vel,
      joint_pos_rel_wo_wrist,       # Joint positions without wrist joints
      joint_vel_rel_wo_wrist,       # Joint velocities without wrist joints
      actions,                      # Previous actions
    ]

    critic_obs: [
      # Robot anchor (base) state in world frame
      generated_commands,
      motion_anchor_pos_b,
      motion_anchor_ori_b,
      robot_body_pos_b,             # All body positions in base frame
      robot_body_ori_b,             # All body orientations in base frame (6D)
      base_lin_vel,
      base_ang_vel,
      joint_pos_rel_wo_wrist,
      joint_vel_rel_wo_wrist,
      actions,                      # Previous actions
    ]

  obs_auxiliary: # define those compounds in obs_dict

    history_actor: {
      robot_anchor_ang_vel_w: 4,
      projected_gravity: 4,
      joint_pos_rel_wo_wrist: 4,
      joint_vel_rel_wo_wrist: 4,
      actions: 4,
      ref_motion_phase: 4
    }

    history_critic: {
      robot_anchor_lin_vel_w: 4,
      robot_anchor_ang_vel_w: 4,
      projected_gravity: 4,
      joint_pos_rel_wo_wrist: 4,
      joint_vel_rel_wo_wrist: 4,
      actions: 4,
      ref_motion_phase: 4,
      motion_anchor_pos_b: 4,
      motion_right_wrist_pos_b: 4,
      motion_left_wrist_pos_b: 4,
    }

  obs_scales: {
    # Robot anchor (base) state
    robot_anchor_ori_w: 1.0,
    robot_anchor_lin_vel_w: 1.0,
    robot_anchor_ang_vel_w: 1.0,
    projected_gravity: 1.0,

    # Root state (body frame)
    base_lin_vel: 1.0,
    base_ang_vel: 1.0,
    
    # Robot body state in anchor frame
    robot_body_pos_b: 1.0,
    robot_body_ori_b: 1.0,
    
    # Joint state
    joint_pos_rel_wo_wrist: 1.0,
    joint_vel_rel_wo_wrist: 1.0,
    
    # Actions
    actions: 1.0,

    # Generated commands (ref joint pos + vel)
    generated_commands: 1.0,
    
    # Motion phase
    ref_motion_phase: 1.0,
    
    # Motion anchor in robot frame
    motion_anchor_pos_b: 1.0,
    motion_anchor_ori_b: 1.0,
    
    # Motion wrists in robot frame
    motion_right_wrist_pos_b: 1.0,
    motion_left_wrist_pos_b: 1.0,
    motion_right_wrist_ori_b: 1.0,
    motion_left_wrist_ori_b: 1.0,
    
    # History
    history_actor: 1.0,
    history_critic: 1.0,
  }

  noise_scales: {
    # Robot anchor (base) state
    robot_anchor_ori_w: 0.05,
    robot_anchor_lin_vel_w: 0.5,
    robot_anchor_ang_vel_w: 0.2,
    projected_gravity: 0.05,

    # Root state (body frame) - align with whole_body_tracking
    base_lin_vel: 0.5,
    base_ang_vel: 0.2,
    
    # Robot body state in anchor frame
    robot_body_pos_b: 0.0,
    robot_body_ori_b: 0.0,
    
    # Joint state
    joint_pos_rel_wo_wrist: 0.01,
    joint_vel_rel_wo_wrist: 0.5,
    
    # Actions
    actions: 0.0,

    # Generated commands (ref joint pos + vel)
    generated_commands: 0.0,
    
    # Motion phase
    ref_motion_phase: 0.0,
    
    # Motion anchor in robot frame
    motion_anchor_pos_b: 0.25,
    motion_anchor_ori_b: 0.05,
    
    # Motion wrists in robot frame
    motion_right_wrist_pos_b: 0.0,
    motion_left_wrist_pos_b: 0.0,
    motion_right_wrist_ori_b: 0.0,
    motion_left_wrist_ori_b: 0.0,
    
    # History
    history_actor: 0.0,
    history_critic: 0.0,
  }

  add_noise_currculum: False
  noise_initial_value: 0.05
  noise_value_max: 1.0
  noise_value_min: 0.00001
  soft_dof_pos_curriculum_degree: 0.00001
  soft_dof_pos_curriculum_level_down_threshold: 40
  soft_dof_pos_curriculum_level_up_threshold: 42

  obs_dims:
    # Robot anchor (base) state
    - robot_anchor_ori_w: 6                    # 6D rotation representation (first 2 columns of rotation matrix)
    - robot_anchor_lin_vel_w: 3                # Linear velocity vector
    - robot_anchor_ang_vel_w: 3                # Angular velocity vector
    - projected_gravity: 3                     # Projected gravity vector
    
    # Robot body state in anchor frame
    # Note: Adjust based on your robot config
    - robot_body_pos_b: ${eval:'3 * (${robot.num_bodies} + 3)'}  # 3 extended bodies hardcoded
    - robot_body_ori_b: ${eval:'6 * (${robot.num_bodies} + 3)'}  # 6D rotation per body

    # Root state (body frame)
    - base_lin_vel: 3
    - base_ang_vel: 3
    
    # Joint state (excluding wrists)
    # NOTE: dof_obs_size should already exclude wrist DOFs for motion tracking setups
    - joint_pos_rel_wo_wrist: ${eval:'${robot.dof_obs_size}'}
    - joint_vel_rel_wo_wrist: ${eval:'${robot.dof_obs_size}'}
    
    # Actions
    - actions: ${robot.dof_obs_size}

    # Generated commands (ref joint pos + vel)
    - generated_commands: ${eval:'2 * ${robot.dof_obs_size}'}
    
    # Motion phase
    - ref_motion_phase: 1                      # Scalar phase value
    
    # Motion anchor in robot frame
    - motion_anchor_pos_b: 3                   # Position vector
    - motion_anchor_ori_b: 6                   # 6D rotation representation
    
    # Motion wrists in robot frame
    - motion_right_wrist_pos_b: 3              # Position vector
    - motion_left_wrist_pos_b: 3               # Position vector
    - motion_right_wrist_ori_b: 6              # 6D rotation representation
    - motion_left_wrist_ori_b: 6               # 6D rotation representation

  post_compute_config: {}  # Will store values after preprocessing, don't put anything here


# ============================================================================
# CONFIGURATION NOTES:
# ============================================================================
# 
# 1. You need to add wrist body names to your robot config:
#    
#    robot:
#      right_wrist_body_name: "right_wrist_link"  # Adjust to your URDF/MJCF
#      left_wrist_body_name: "left_wrist_link"    # Adjust to your URDF/MJCF
#
# 2. CRITICAL: Adjust the number of wrist DOFs in obs_dims:
#    - If you don't know, run this after env initialization:
#      print("Wrist joint IDs:", env.wrist_joint_ids)
#      print("Number of wrist DOFs:", len(env.wrist_joint_ids))
#    - Then update:
#      joint_pos_rel_wo_wrist: ${eval:'${robot.dof_obs_size} - <num_wrist_dofs>'}
#
# 3. The number of extended bodies is hardcoded as 3 in robot_body_pos_b and 
#    robot_body_ori_b. If your robot has a different number, adjust accordingly.
#
# 4. Actor observations are more compact (no body positions/wrists) for efficiency
#    Critic observations include full state for better value estimation
#
# ============================================================================
